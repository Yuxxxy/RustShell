[package]
name = "rustshell-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
ureq.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
flume.workspace = true
dirs.workspace = true
chrono.workspace = true
log.workspace = true
encoding_rs.workspace = true
tokio.workspace = true
russh.workspace = true
russh-sftp.workspace = true
sha2.workspace = true
portable-pty.workspace = true
# SMTP 投递（预警邮件）：TLS 握手 + 系统根证书集
rustls.workspace = true
rustls-native-certs.workspace = true
# russh 默认加密后端 aws-lc-sys 在 Windows 需要 NASM；启用预编译对象绕过
aws-lc-sys = { version = "0.45", features = ["prebuilt-nasm"] }

# 更新下载要跟着 Windows「Internet 选项」里的系统代理走（直连 github.com 在本机
# 15s 超时、api.github.com 却通，2026-11-06 真机故障）。只在 Windows 上需要。
# 版本与依赖树里已有的那条对齐，不引入第二份。
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
