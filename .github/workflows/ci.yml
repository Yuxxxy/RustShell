# RustShell CI 门禁
# 目标：编译期问题（含集成测试）在 5 分钟内暴露（评审遗留项 2026-09-09）。
# 说明：gpui-pre-platform 当前为 Windows Win32/DirectWrite 后端，故跑 windows-latest；
#       集成测试 local_shell（真实 ConPTY，50-100s）与 docker_ssh（需 Docker）不在此执行，
#       但 --no-run 会完整编译它们——本轮 docker_ssh.rs 的编译失败即为此类，可被该门禁拦截。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      # 静态检查门禁（N17）：clippy 警告视为错误，防止新增游离警告
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 编译门禁：--no-run 会编译全部测试目标（含集成测试），编译失败 5 秒内暴露
      - name: Compile all targets (incl. integration tests)
        run: cargo test --workspace --no-run

      # 快速单测：仅 lib 单元测试，不在 CI 内跑真实 ConPTY/SSH 集成用例
      - name: Unit tests
        run: cargo test --workspace --lib
