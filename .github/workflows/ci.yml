# RustShell CI 门禁
# 目标：编译期问题（含集成测试）在 5 分钟内暴露（评审遗留项 2026-09-09）。
# 说明：门禁跑在 windows-latest 上 —— 它是当前日常实测平台，且集成测试 local_shell 依赖
#       真实 ConPTY（Windows 专有）；macOS / Linux 的**构建**由 release.yml 覆盖。
#       集成测试 local_shell（真实 ConPTY，50-100s）与 docker_ssh（需 Docker）不在此执行，
#       但 --no-run 会完整编译它们——本轮 docker_ssh.rs 的编译失败即为此类，可被该门禁拦截。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      # JS Action 一律固定到「**首个**声明 `using: node24` 的主版本」：Node20 已于
      # 2026-09-23 从所有 runner 上移除（官方时间线：2026-06-16 默认切 Node24，
      # 2026-09-23 移除 Node20），旧版本既会打印弃用告警，下一轮也会被强制跑在 node24 上。
      # checkout 与 cache 的首个 node24 主版本都是 v5（已核对 action.yml 的 runs.using）。
      # ⚠️ upload-artifact 是例外，它的 v5 仍是 node20 —— 见 release.yml，别按这里"统一"。
      - uses: actions/checkout@v5

      # ⚠️ 工具链必须**钉版本**，不能写 `@stable`：
      #   rustfmt 的折行规则会跨版本变（1.10 改了长链式调用的折行策略），clippy 的
      #   告警集也是。于是「跟着 stable 漂移」的 fmt 门禁会在 stable 升级当天全仓变红，
      #   而报错文件与当次改动毫无关系 —— 本仓曾因此连续红了一个多月（run #16 ~ #31）。
      # 版本号写在仓库根的 rust-toolchain.toml 里（本地与 CI 共用同一份），
      # 升级流程见那份文件的注释。
      #
      # 这里用 `@1.99.1` 这个**版本 ref**（而不是 `@master` + toolchain 输入）：
      #   action 会把 ref 里的版本号直接当工具链版本装上，零歧义。反过来
      #   `@master` + `toolchain: 1.99` 会被当成「N 个月前的 stable」翻译 —— 两段式
      #   版本号有特殊语义，三段式才走「原样透传」。别把这处改成两段式。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      # 静态检查门禁（N17）：clippy 警告视为错误，防止新增游离警告
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 编译门禁：--no-run 会编译全部测试目标（含集成测试），编译失败 5 秒内暴露
      - name: Compile all targets (incl. integration tests)
        run: cargo test --workspace --no-run

      # 快速单测：仅 lib 单元测试，不在 CI 内跑真实 ConPTY/SSH 集成用例
      - name: Unit tests
        run: cargo test --workspace --lib
