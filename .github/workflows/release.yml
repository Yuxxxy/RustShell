# RustShell 发布打包（Windows + macOS 通用二进制 + Linux x64/arm64）
#
# 为什么需要 CI：gpui-pre 的平台后端是 **每个 OS 各一套**，只能在该 OS 上链接 ——
#   · gpui-pre-macos 依赖 Cocoa/AppKit / Metal
#   · gpui-pre-linux 依赖 X11 / Wayland / xkbcommon / fontconfig
#   · gpui-pre-windows 依赖 Win32 / DirectWrite
# 所以 Windows 机器交叉编译不出 macOS / Linux 产物，必须在官方 runner 上各编各的。
#
# 触发方式：
#   · 手动：Actions 页 -> Release Build -> Run workflow（选择平台）
#   · 打 tag：git tag v1.0.0 && git push origin v1.0.0
#     除 artifact 外还会**自动建 GitHub Release 并上传成品**（见文件末尾的 publish）。
#
# 产物：每个平台**只有一个可直接安装的文件**，命名规则全仓唯一 ——
#
#     RustShell-<平台>-<版本>.<扩展名>
#
#   · windows-x64      windows-latest   -> RustShell-windows-x64-<ver>.exe    （NSIS 安装包）
#   · macos-universal  macos-latest     -> RustShell-macos-universal-<ver>.dmg（内含 .app + /Applications 软链）
#   · linux-x64        ubuntu-22.04     -> RustShell-linux-x64-<ver>.deb
#   · linux-arm64      ubuntu-22.04-arm -> RustShell-linux-arm64-<ver>.deb
#
# 为什么不再出「绿色包」（免安装 zip / tar.gz）：
#   Actions 的 artifact 在下载时会被 GitHub **再包一层 zip**，于是用户拿到的是
#   「压缩包里还有一个压缩包」；而绿色包本身就是压缩包，等于套娃两层。改成安装文件
#   之后，.exe / .dmg / .deb 都不是压缩包，artifact 里就只剩这一个文件。
#   安装文件的生成逻辑不写在 workflow 里，而是三个脚本（本地与 CI 共用同一份）：
#     scripts/package-windows.sh（cargo-packager + 改名）
#     scripts/package-macos.sh  （组装 .app + ad-hoc 签名 + dmg + 挂载校验）
#     scripts/package-linux.sh  （目录树 + control + dpkg-deb + 包内容校验）
#
# macOS 用真正的通用二进制：x86_64 与 aarch64 各编一遍再 lipo 合并，
# 并由 lipo -archs 断言（见 scripts/package-macos.sh 与下面的 Verify binary）。
#
# Linux 两条选 22.04 而不是 -latest（24.04）：产物要求的最低 glibc 由**构建机**决定，
# 在 22.04（glibc 2.35）上构建才能在 22.04 及更新的发行版上跑；用 24.04 构建出来的
# 二进制在 22.04 上会直接 `GLIBC_2.39 not found`。.deb 的 Depends 里那条
# `libc6 (>= 2.35)` 也是按构建机实测的 glibc 生成的（见 package-linux.sh）。
#
# Windows 侧的 NSIS 安装包由 cargo-packager 生成（配置在 app/Cargo.toml；
# 本地等价命令是 ./scripts/package-windows.sh）。注意：packager 以 crate 目录 app/
# 为工作目录，中间产物落在仓库根的 dist/packager/，改名后的安装包落在 dist/。

name: Release Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '目标平台 (windows / macos / linux / all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # workflow_dispatch 的平台过滤必须在这里做完，不能写成 build 的 job 级 if：
  #   · job 级 if 的可用上下文只有 github / needs / vars / inputs，**没有 matrix**
  #     （matrix 在 runs-on 和 steps.if 里可用，唯独 job 级 if 不可用——它求值早于矩阵展开）；
  #   · strategy.matrix 的取值本身又不支持表达式，所以也没法把「当前平台」塞进矩阵条件里绕开。
  # 于是先由 plan 算出「本次要构建的矩阵」，build 再用 fromJSON 消费。
  # 好处：build 侧的公共骨架（取版本、装工具链、校验、上传）只写一份，平台差异用 steps.if 分流。
  #
  # 矩阵项字段（每加一个字段，build 里的引用点都要跟着改，所以字段名一次定准）：
  #   os            runner 标签
  #   target        平台分组，steps.if 用它做分支（windows / macos / linux）
  #   artifact      平台标识：**也是产物文件名里的平台段**（dist/RustShell-<artifact>-<ver>.<ext>）
  #                 以及 artifact 名的来源。改它等于改最终发布出去的文件名。
  #   ext           安装文件的扩展名：exe / dmg / deb
  #   bin_name      构建产物在仓库根下的相对路径（Verify 与打包脚本都读它）
  #   rust_targets  交给 dtolnay/rust-toolchain 的附加 rustup 目标（逗号分隔，空串=不加）
  #   expect_arch   期望的 `uname -m`：守住「产物名字里的架构」与「runner 真实架构」一致。
  #                 macOS 留空 —— 那两条架构都是我们主动编的，改由 lipo -archs 查产物本身。
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      # v5 = checkout 的首个 node24 主版本（Node20 已于 2026-09-23 从 runner 移除）
      - uses: actions/checkout@v5

      # 先花 10 秒把三类「静默错」挡住，再决定要不要起 1~2 小时的编译
      # （脚本：scripts/check-release-workflow.py）：
      #   · 换行 / 不可见字符 —— 混进一个 CR，Linux/macOS 上的 bash 会把整行当成
      #     选项名或命令名，报出来的错跟真实原因毫无关系（"invalid option name"、
      #     "$'\r': command not found" 之类），排查成本极高；
      #   · 每个 run 块的 shell 语法（bash -n，先把它里面的 ${{ }} 换成哑值）；
      #   · 版本号能否从 Cargo.toml 解析出来、且不含文件名非法字符。
      # 2026-10-16 那次 macOS 红（BSD sed 静默失败 → 产物名里带双引号 →
      # upload-artifact 以「文件名含非法字符」拒绝）本来可以在这里就拦住。
      - name: Preflight check
        shell: bash
        run: python3 scripts/check-release-workflow.py

      - id: pick
        name: Resolve build targets
        shell: bash
        env:
          # 走 env 而不是直接内插 ${{ }}，避免输入值被当成 shell 代码执行
          EVENT: ${{ github.event_name }}
          PLATFORM: ${{ github.event.inputs.platform }}
        run: |
          # 先逐条声明，再拼组合 —— 免得像以前那样把同一条矩阵项抄三遍，
          # 加个字段就漏抄一处（漏抄不会报错，只会让某个平台少一个产物）。
          # macOS 的 bin_name 指向 lipo 合并后的文件，不是 cargo 的 target/release/
          # （通用二进制的构建方式见下面 Build release (macos universal)）。
          WIN_ITEM='{"os":"windows-latest","target":"windows","artifact":"windows-x64","ext":"exe","bin_name":"target/release/rustshell.exe","rust_targets":"","expect_arch":"x86_64"}'
          MAC_ITEM='{"os":"macos-latest","target":"macos","artifact":"macos-universal","ext":"dmg","bin_name":"target/universal-apple-darwin/release/rustshell","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin","expect_arch":""}'
          LIN_X64_ITEM='{"os":"ubuntu-22.04","target":"linux","artifact":"linux-x64","ext":"deb","bin_name":"target/release/rustshell","rust_targets":"","expect_arch":"x86_64"}'
          LIN_ARM_ITEM='{"os":"ubuntu-22.04-arm","target":"linux","artifact":"linux-arm64","ext":"deb","bin_name":"target/release/rustshell","rust_targets":"","expect_arch":"aarch64"}'

          WIN="{\"include\":[$WIN_ITEM]}"
          MAC="{\"include\":[$MAC_ITEM]}"
          LIN="{\"include\":[$LIN_X64_ITEM,$LIN_ARM_ITEM]}"
          ALL="{\"include\":[$WIN_ITEM,$MAC_ITEM,$LIN_X64_ITEM,$LIN_ARM_ITEM]}"

          if [ "$EVENT" != "workflow_dispatch" ] || [ -z "$PLATFORM" ] || [ "$PLATFORM" = "all" ]; then
            TARGETS="$ALL"      # 打 tag 推送 / 选 all -> 全平台
          elif [ "$PLATFORM" = "windows" ]; then
            TARGETS="$WIN"
          elif [ "$PLATFORM" = "macos" ]; then
            TARGETS="$MAC"
          elif [ "$PLATFORM" = "linux" ]; then
            TARGETS="$LIN"
          else
            echo "::error::未知的 platform 取值 '$PLATFORM'（可选 all / windows / macos / linux）"
            exit 1
          fi
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "本次构建矩阵：$TARGETS"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    steps:
      # v5 = checkout 的首个 node24 主版本（Node20 已于 2026-09-23 从 runner 移除）
      - uses: actions/checkout@v5

      # 版本号只在这里解析一次，后面每个步骤统一消费 —— 原先它们各自把同一行
      # `sed -E 's/version\s*=\s*"([^"]+)"/\1/'` 抄了一遍。
      #
      # 2026-10-16 Release #2 的 macOS 失败就出在这行：`\s` 是 **GNU sed 扩展**，
      # BSD sed（macOS runner 的 /usr/bin/sed）不认它，会把 `\s` 当成字面量 `s`，
      # 正则因此匹配不到 `version = "1.0.0"` ⇒ 替换**静默失败**（sed 的 s 命令不匹配
      # 时不报错，原样输出）⇒ `VERSION` 变成**整行** `version = "1.0.0"`，
      # 产物目录/压缩包名里于是带上了双引号，upload-artifact 以「文件名含非法字符」
      # 直接拒绝：`/rustshell-version = "1.0.0"-macos-x64-arm64.zip`。
      # Windows runner 走 Git Bash 的 **GNU** sed，`\s` 生效 —— 所以同一个 workflow
      # 只有 macOS 这一路红。
      #
      # 现在改用 awk 按引号切分：完全不涉及正则转义，GNU / BSD 行为一致。
      # 顺带把「解析结果不合法」变成**当场失败**，不再拖到 upload 阶段才炸。
      - name: Resolve version
        id: ver
        shell: bash
        env:
          # 平台段走 env 而不是内插 ${{ }}：与本文件其它地方同一口径
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          VERSION=$(awk -F'"' '/^version/ { print $2; exit }' Cargo.toml)
          case "$VERSION" in
            '')
              echo "::error::Cargo.toml 里找不到 ^version 行，取不到版本号"
              exit 1
              ;;
            *[!0-9A-Za-z.+-]*)
              echo "::error::版本号 '$VERSION' 含文件名非法字符（只允许 0-9 A-Z a-z . + -）"
              exit 1
              ;;
          esac
          # 产物基名只在这里拼一次：打包脚本的产物名、上传时的匹配路径全部由它派生。
          # 三处各自拼字符串 = 三处都可能拼错，而且拼错了也不会报错，只会静默产出一个
          # 名字不对（但看起来很像对）的产物 —— 正是 2026-10-16 那次事故的形态。
          # 完整文件名 = dist/<pkg>.<ext>，与 scripts/package-*.sh 的产物名必须逐字相同
          # （Packaged 后紧跟的 Verify installer 会拿这个路径去 stat）。
          PKG="RustShell-$ARTIFACT-$VERSION"
          {
            echo "version=$VERSION"
            echo "pkg=$PKG"
          } >> "$GITHUB_OUTPUT"
          echo "版本号 $VERSION；产物基名 $PKG"

      # rust_targets 由矩阵给：macOS 通用二进制要 aarch64 + x86_64 两个目标，
      # 其余平台为空串（只装 host 目标）。dtolnay 这个 action 的 targets 是逗号分隔。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # Linux 的**构建期**系统依赖 —— 逐条从 Linux 目标的真实依赖闭包里查出来：
      #   `cargo metadata --filter-platform x86_64-unknown-linux-gnu` 沿 deps 走完闭包
      #   （rustshell 的 Linux 闭包 712 个包，其中 28 个声明了外部链接），再扫每个包的
      #   build.rs（pkg-config / rustc-link-lib）与源码里的 `#[link(name = ...)]`。
      #   **依赖升级后要重新做这项审计**（脚本是一次性的，审计结论已固化在本清单与
      #   scripts/package-linux.sh 的 pkg-config 探测里，故不入库）：
      #     cargo metadata --filter-platform x86_64-unknown-linux-gnu --format-version 1
      #   沿 deps 走闭包，再扫每个包的 build.rs 与 `#[link(name = ...)]`。
      #
      # 三个来源必须分清，漏掉第二类就是 2026-10-16 的 Linux 红：
      #   ① build.rs 里调 pkg-config 的 —— 缺失时当场 panic，提示里通常带 apt 包名；
      #   ② **只写 `#[link(name = "x")]`、压根没有 build.rs 的** —— 编译期不报错，
      #      一路编到**链接**阶段才炸成 `unable to find library -lx`，且不提示装哪个包；
      #   ③ 走 CMake / cc 现场构建的 —— 要 cmake / gcc。
      #
      #   · libdbus-1-dev ①—— keyring → dbus-secret-service → dbus → libdbus-sys，
      #       build.rs 直接 `pkg_config::probe("dbus-1")`，找不到就 panic。
      #   · libx11-dev ①—— gpui-pre-linux（非可选）→ zed-scap → xcb → x11 crate。
      #       x11 的 build.rs 按 feature 逐项 probe，我们只开 `xlib`，故只 probe
      #       `x11 >= 1.4.99.1`，而且用 `.unwrap()`。
      #   · libxcb1-dev ①②—— 同一条链上的 libxcb（xcb crate 的 xlib_xcb；
      #       x11rb 源码里的 `#[link(name = "xcb")]`）。
      #   · libxkbcommon-dev / libxkbcommon-x11-dev ②—— **那次 Linux 红的根因**。
      #       gpui-pre-linux 直接依赖 xkbcommon 0.8，而 `src/xkb/ffi.rs` 写的是
      #       `#[link(name = "xkbcommon")]`、`src/xkb/x11/ffi.rs` 写的是
      #       `#[link(name = "xkbcommon-x11")]`。它既没有 build.rs 也不走 pkg-config，
      #       所以既不 panic 也不提示装包，只在链接时变成
      #       `rust-lld: error: unable to find library -lxkbcommon`。
      #       （x11 feature 确实是开着的：锁文件里 xkbcommon 的依赖含
      #        as-raw-xcb-connection，那正是 x11 feature 带进来的。）
      #       dev 包提供的正是链接用的 `libxkbcommon.so` / `libxkbcommon-x11.so`。
      #   · libfontconfig1-dev / libfreetype-dev ①—— gpui-pre-wgpu → zed-font-kit 的
      #       Linux 字体后端：yeslogic-fontconfig-sys 是 `find_library("fontconfig").unwrap()`；
      #       freetype-sys probe `freetype2 >= 24.3.18`（probe 失败会退回 cc 现场编 vendored
      #       源码，能过但慢、且要 g++，所以照装）。
      #   · build-essential / pkg-config ③—— ring 的 C 与汇编、以及上面几次 probe 的工具。
      #   · cmake ③—— rustls 的默认 provider 是 aws-lc-rs，其 aws-lc-sys 0.45 用 cmake crate
      #       起 CMake 构建（NASM 只在 Windows 目标上需要）。runner 镜像本来自带 cmake，
      #       这里显式装一次是为了不赌镜像内容。
      #
      # 以下是**故意不装**的（同样查过闭包，并对着链接器报错逐条反证，装了纯属浪费）：
      #   · libwayland-dev：wayland-sys 的 build.rs 确实会 probe wayland-client 等四个 .pc，
      #     但那几段全在 `dlopen` feature 门后，开了 dlopen 就直接返回 —— 不产生
      #     `-lwayland-client`。**反证**：链接器会把所有找不到的 -l 一次性列出来，那次报错
      #     里只有 xkbcommon 两个，没有 wayland ⇒ dlopen 路径确实生效。
      #   · libegl* / libvulkan-dev：khronos-egl 是 `dynamic` + `no-pkg-config`、ash 是
      #     `loaded`，都是运行时 dlopen（同上，报错里也没有 -lEGL / -lvulkan）；
      #     GPU 驱动由用户机器提供。
      #   · libssl-dev：锁文件里**没有 openssl-sys**，TLS 走纯 Rust 的 rustls。
      - name: Install Linux system dependencies
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libdbus-1-dev \
            libx11-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev

      # key 里必须带 matrix.artifact：x64 与 arm64 两个 Linux job 的 runner.os 都是
      # "Linux"、Cargo.lock 哈希也一样，不带 artifact 的话两条 job 会抢同一份缓存
      # （arm64 job 可能把 x64 编出来的 target/ 全量恢复进来，白占磁盘还拖慢）。
      # restore-keys 是给「Cargo.lock 变了」这种情况兜底的：精确 key 未命中时退到
      # 同平台的前一份缓存，增量编译仍能重用绝大多数依赖（否则每次锁文件一动就全量重编）。
      - name: Cache cargo
        # v5 = cache 的首个 node24 主版本（v4 是 node20，会在日志里打弃用告警）
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.artifact }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ matrix.artifact }}-

      - name: Build release
        if: matrix.target != 'macos'
        run: cargo build --release -p rustshell

      # macOS：真·通用二进制。两条架构各编一遍再 lipo 合并 —— 与
      # scripts/package-macos.sh 的「不传参数」分支完全同一口径。
      # （此前 CI 只跑 host 单架构，却把产物命名成 macos-x64-arm64，
      # Intel 机器解压后会直接 `bad CPU type in executable`；名字必须与内容一致，
      # 下面的 Verify 会拿 `lipo -archs` 把这件事钉死。）
      # 代价：macos job 的编译量约翻倍 —— 交叉目标要从头编整棵依赖树，缓存帮不上忙。
      - name: Build release (macos universal)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p rustshell --target aarch64-apple-darwin
          cargo build --release -p rustshell --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/rustshell \
            target/x86_64-apple-darwin/release/rustshell \
            -output target/universal-apple-darwin/release/rustshell
          file target/universal-apple-darwin/release/rustshell

      # 两件必须当场抓住的事：
      #   ① 产物真的在矩阵声明的 bin_name 上（写错时以前要拖到 upload 阶段才炸）；
      #   ② 产物名里的架构 == 真实架构。runner 标签换架构（例如某个 -latest 悄悄换掉
      #      宿主架构）不会报任何错，只会让产物名变成一句假话，所以在这里断言。
      #      macOS 不查 host 架构（两条架构都是我们主动编的），改用 lipo -archs 查产物本身。
      - name: Verify binary
        shell: bash
        env:
          BIN: ${{ matrix.bin_name }}
          EXPECT_ARCH: ${{ matrix.expect_arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ls -lh "$BIN"
          # `file` 不是 Git Bash 的自带命令（Windows runner 上没有），所以有条件地调 ——
          # 不能直接写，否则 set -e 会把「打印文件类型」这种尽力而为的步骤变成失败。
          if command -v file >/dev/null 2>&1; then file "$BIN"; fi
          if [ "$TARGET" = "macos" ]; then
            ARCHS="$(lipo -archs "$BIN")"
            echo "通用二进制包含架构：$ARCHS"
            case "$ARCHS" in
              *x86_64*) ;;
              *) echo "::error::产物缺少 x86_64 架构，名字里的 macos-universal 名不副实"; exit 1 ;;
            esac
            case "$ARCHS" in
              *arm64*) ;;
              *) echo "::error::产物缺少 arm64 架构，名字里的 macos-universal 名不副实"; exit 1 ;;
            esac
          else
            HOST_ARCH="$(uname -m)"
            echo "runner 架构：$HOST_ARCH（矩阵声明 $EXPECT_ARCH）"
            if [ "$HOST_ARCH" != "$EXPECT_ARCH" ]; then
              echo "::error::runner 架构 $HOST_ARCH 与矩阵声明的 $EXPECT_ARCH 不一致（runner 标签换架构了？）"
              exit 1
            fi
          fi
          echo "校验通过：$BIN"

      # ── 打包：三个平台各出一个安装文件 ─────────────────────────────────────
      #
      # 具体逻辑不在 workflow 里，而在 scripts/package-*.sh —— 同一份实现既是
      # CI 的打包步骤，也是本地的一条命令（不传参数即「先编译再打包」）。
      # 这里只负责「装依赖 + 调用 + 验名」。
      #
      # ⚠️ 三个脚本一律用 `bash ./scripts/xxx.sh` 调用，**不写 `./scripts/xxx.sh`**。
      # 2026-10-18 第一次跑就栽在这上面：脚本是在 Windows 上 `git add` 的，而
      # Git for Windows 默认 `core.filemode=false` —— `chmod +x` 根本不进索引，
      # 入库的 blob 全是 100644。于是 Linux / macOS runner 上 `./script.sh` 报
      # `Permission denied`（exit 126），而 Windows runner 的 Git Bash 不检查执行位，
      # 同一次 run 里只有两个平台红、一个绿，看着像平台相关 bug。
      # 索引里的模式已经用 `git update-index --chmod=+x` 修过，但显式 `bash` 前缀
      # 才是真正不会复发的那道保险：它不依赖克隆下来的文件权限。
      # macOS / Linux 会把矩阵给的 bin_name 作为参数传进去：脚本不会自己猜
      # target/release/ —— macOS 的产物在 target/universal-apple-darwin/ 下，
      # 猜错就等于安静地打包一个不存在的文件。Windows 例外：cargo-packager
      # 的输入来自 cargo metadata，不读命令行参数（原因见下面那一步）。
      - name: Install cargo-packager (windows)
        if: matrix.target == 'windows'
        run: cargo install cargo-packager --locked --version ^0.11

      # 脚本内部：调用 packager → 把 `rustshell_<ver>_<arch>-setup.exe`
      # 改名成 `RustShell-windows-<arch>-<ver>.exe` → 校验体积。
      # 这里**不传 bin_name**：packager 的输入不来自命令行，而是 cargo metadata
      # 推出来的 binaries 目录（`--release` ⇒ target/release）加配置里的
      # before-packaging-command，传参数它也读不到。二进制是否在预期位置，
      # 上一步 Verify binary 已经断言过。
      # 不传 --formats：默认取 app/Cargo.toml 里的 formats（nsis），口径只有一处。
      - name: Package installer (windows)
        if: matrix.target == 'windows'
        shell: bash
        run: bash ./scripts/package-windows.sh

      # 脚本内部：组装 RustShell.app（Info.plist / PkgInfo / icns）→ ad-hoc 签名
      # → hdiutil 出 UDZO 镜像 → 挂载回读校验 .app 与 /Applications 软链。
      - name: Package installer (macos)
        if: matrix.target == 'macos'
        shell: bash
        env:
          # 走 env 而不是内插 ${{ }}：与本文件其它地方同一口径
          BIN: ${{ matrix.bin_name }}
        run: |
          set -euo pipefail
          : "${BIN:?bin_name 为空（矩阵项缺字段？）}"
          bash ./scripts/package-macos.sh "$BIN"

      # 脚本内部：目录树（/usr/bin + .desktop + hicolor 图标 + copyright）
      # → 按构建机 glibc 生成 Depends → dpkg-deb --root-owner-group → 包内容校验。
      # 第二个参数（架构）刻意**不传矩阵值**：脚本按 uname -m 取真实架构，
      # 与上面 Verify binary 的 runner 架构断言互为印证；传矩阵值反而会掩盖
      # 「runner 换架构了」这件事。
      - name: Package installer (linux)
        if: matrix.target == 'linux'
        shell: bash
        env:
          BIN: ${{ matrix.bin_name }}
        run: |
          set -euo pipefail
          : "${BIN:?bin_name 为空（矩阵项缺字段？）}"
          bash ./scripts/package-linux.sh "$BIN"

      # 打包脚本产出的文件名必须与 Resolve version 算出的**逐字相同**。
      # 两者是独立推导的（脚本按自己的规则拼、这里按 matrix.artifact + version 拼），
      # 所以这一条断言同时在守两件事：命名规则没漂移、产物确实存在。
      # 少了它，名字不一致只会在 upload 阶段以「no files found」收场，
      # 而那个报错看不出「是命名漂移还是压根没打包」。
      - name: Verify installer
        shell: bash
        env:
          PKG: ${{ steps.ver.outputs.pkg }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          : "${PKG:?产物基名解析失败（Resolve version 的输出丢了？）}"
          : "${EXT:?ext 为空（矩阵项缺字段？）}"
          OUT="dist/$PKG.$EXT"
          if [ ! -f "$OUT" ]; then
            echo "::error::没有找到 $OUT —— 打包脚本的产物名与 workflow 的命名规则不一致，或打包其实失败了"
            echo "dist/ 实际内容："
            ls -lR dist || true
            exit 1
          fi
          ls -lh "$OUT"

      # 只传**这一个**文件。以前这里有三条 glob（绿色 zip + tar.gz + packager 目录），
      # 于是下载 artifact 时用户拿到的是「zip 里还有一个 zip」。
      # artifact 名带上版本号：同一次 run 的四个平台名互不冲突，
      # 且历史 run 里翻 artifact 时能直接看出是哪个版本。
      # artifact-name 与文件名刻意一致（下载得到 <名字>.zip，里面就是 <名字>.<ext>）。
      # upload-artifact 必须用 v6，**不能只升到 v5**：v5.0.0 的 release note 措辞含糊，
      # 但它的 action.yml 里 `runs.using` 实际仍是 `node20`（已直接拉取核对），
      # node24 支持是从 v6.0.0 起（"Upload Artifact Node 24 support"）。
      # 这是本次唯一需要跨两个大版本的一个；v6 的输入与 v4 完全一致
      # （name / path / if-no-files-found 都在），所以下面无需改动。
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.ver.outputs.pkg }}
          path: dist/${{ steps.ver.outputs.pkg }}.${{ matrix.ext }}
          if-no-files-found: error

  # 打 tag 推送（v1.0.0）时，把四个成品发布到 GitHub Release。
  #
  # 为什么还要 Release：Actions 的 artifact 在下载时会被 GitHub **再包一层 zip**，
  # 用户点「Download」拿到的是 `RustShell-windows-x64-1.0.0.zip`，里面才是 exe。
  # Release 页的 assets 则是文件本身，点一下就是 .exe / .dmg / .deb。
  #
  # 只有 tag 触发才发布；workflow_dispatch 手动跑只出 artifact（便于试跑，
  # 不至于每次调试都在仓库里留一个 Release）。
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # gh release create/upload 要写权限；actions: read 留给 artifact 下载
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      # tag 与 Cargo.toml 必须一致：拿 v1.0.1 的 tag 打出 1.0.0 的包，是 Release 页上
      # 看起来完全正常、装上去版本号却不对的一类错误。
      - name: Resolve version
        id: ver
        shell: bash
        env:
          # ref_name 在 tag 触发时是 `v1.0.0`
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(awk -F'"' '/^version/ { print $2; exit }' Cargo.toml)
          if [ -z "$VERSION" ]; then
            echo "::error::Cargo.toml 里找不到 ^version 行，取不到版本号"
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::tag $TAG 与 Cargo.toml 的版本 $VERSION 不一致 —— 先改版本号再打 tag"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag $TAG 与版本号 $VERSION 一致"

      # merge-multiple: true —— 四个 artifact 平铺进 dist/，而不是各占一个子目录。
      # 必须用 v8（node24）：v5/v6 的 action.yml 里 runs.using 仍是 node20，
      # 而 Node20 已于 2026-09-23 从 runner 移除。v7 起才有 Node24 支持。
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          : "${TAG:?}"
          : "${VERSION:?}"
          ls -lh dist

          # 断言每个文件都符合 RustShell-<平台>-<版本>.<exe|dmg|deb>。
          # 这条只是兜底：真正拦住命名漂移的是 build 里的 Verify installer。
          BAD=$(find dist -maxdepth 1 -type f \
            ! -name "RustShell-*-$VERSION.exe" \
            ! -name "RustShell-*-$VERSION.dmg" \
            ! -name "RustShell-*-$VERSION.deb")
          if [ -n "$BAD" ]; then
            echo "::error::下列文件不符合命名规则："
            echo "$BAD"
            exit 1
          fi
          COUNT=$(find dist -maxdepth 1 -type f | wc -l)
          echo "待发布文件 $COUNT 个"

          # 发布说明：直接写「下载哪个 + 怎么装」，而不是指望用户去翻 README。
          # 未签名/未公证的后果必须写在最显眼的位置 —— 否则用户第一句反馈
          # 一定是「打不开，说未知发布者」。
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "## 下载"
            echo
            echo "| 平台 | 文件 | 说明 |"
            echo "| --- | --- | --- |"
            echo "| Windows 10/11 (x64) | \`RustShell-windows-x64-$VERSION.exe\` | NSIS 安装包，装到当前用户，不弹 UAC |"
            echo "| macOS (Intel / Apple Silicon) | \`RustShell-macos-universal-$VERSION.dmg\` | 打开后把 RustShell 拖进「应用程序」 |"
            echo "| Linux (x64) | \`RustShell-linux-x64-$VERSION.deb\` | \`sudo apt install ./RustShell-linux-x64-$VERSION.deb\` |"
            echo "| Linux (arm64) | \`RustShell-linux-arm64-$VERSION.deb\` | \`sudo apt install ./RustShell-linux-arm64-$VERSION.deb\` |"
            echo
            echo "## 首次运行"
            echo
            echo "- **Windows**：安装包未做代码签名，SmartScreen 会提示「未知发布者」，点「更多信息 → 仍要运行」。"
            echo "- **macOS**：dmg 里的 App 只做了 ad-hoc 签名、未公证，首次请**右键 → 打开**；"
            echo "  或在终端执行 \`xattr -dr com.apple.quarantine /Applications/RustShell.app\`。"
            echo "- **Linux**：.deb 会一并装好桌面入口与图标；也可以直接命令行运行 \`rustshell\`。"
          } > "$NOTES"

          # 已存在就只补传（--clobber 覆盖同名 asset），否则新建。
          # 这样「打 tag 失败 → 重跑」不会因为 Release 已存在而整步失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为补传"
          else
            gh release create "$TAG" --title "RustShell $TAG" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" dist/* --clobber
          echo "已发布："
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name)  \(.size) 字节"'
