[package]
name = "rustshell-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustshell-core.workspace = true
sysinfo.workspace = true
portable-pty.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
flume.workspace = true

# P1-9：非 Windows 密码走 OS 凭据库（macOS Keychain / Linux Secret Service）
# Windows 构建不编译此依赖（DPAPI 直接走 crypt32）
[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }

# 集成测试要连真实 SSH 会话（tests/ssh_pump_no_spin.rs），需要直接引用 flume
# 来拿连接结果通道。flume 本来就在整棵依赖树里，不引入新的下载。
[dev-dependencies]
flume = { workspace = true }
