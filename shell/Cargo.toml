[package]
name = "rustshell-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustshell-core.workspace = true
rustshell-platform.workspace = true
rustshell-ui.workspace = true
gpui.workspace = true
gpui-platform.workspace = true
gpui-component.workspace = true
anyhow.workspace = true
log.workspace = true
rust-embed = "8"

[dev-dependencies]
# 键位回归测试要在 App 上下文里装配绑定：gpui-kit 0.9.0 起动态键位只能走
# `KeyBinding::load(.., cx)`（`KeyBinding::new` 收紧为 `&'static str`），
# 所以要一个 TestAppContext 喂给 `keybindings(cx)`。与 ui 的同名 dev-dep 一致。
gpui = { workspace = true, features = ["test-support"] }
