[package]
name = "rustshell-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustshell-core.workspace = true
rustshell-platform.workspace = true
# GPUI 门面（gpui-kit 0.9.1）：gpui / 组件库 / gpui-base / 图标全量目录全在这一条里，
# 源码里的 `gpui::` 由 crate 根的 `extern crate gpui_kit as gpui;` 接住（derive 宏要用）。
# 具体用途：`gpui_kit::base::SelectableText`（AI 面板明细的纯文本可拖选）、
# `gpui_kit::assets::IconName`（全量 Lucide 枚举，`gpui::component::IconName` 只是子集）。
gpui-kit.workspace = true
rustshell-terminal.workspace = true
portable-pty.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
flume.workspace = true
log.workspace = true
# AI 会话落盘（ai_chats.json）：存储格式与线上格式解耦，见 `main_view/ai_persist.rs`
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# 主题装配回归测试需要 gpui 的 TestAppContext（见 ui/src/theme.rs::tests）
gpui-kit = { workspace = true, features = ["test-support"] }
