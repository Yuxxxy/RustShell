[workspace]
resolver = "2"
members = ["app", "shell", "ui", "core", "platform", "terminal"]

[workspace.package]
version = "0.1.14"
edition = "2021"
license = "Apache-2.0"
authors = ["yuxinyu"]

[workspace.dependencies]
# ZMODEM 协议状态机（无 I/O、no_std）：终端引擎用它实现 rz/sz 与拖放上传。
# 选它而不是 lrzsz 绑定：纯 Rust、可跨所有传输（本地 PTY / SSH / 将来的串口），
# 且协议层不碰文件系统 —— 收发落点全由本仓决定。
zmodem2 = "0.7.3"
# --- GPUI 生态（统一入口：gpui-kit 门面单依赖） ---
#
# 2026-11-16：从「gpui-component 0.9.0 + 五条手写拆分依赖」升级到 **gpui-kit 0.9.1 门面**
# （上游 README 的推荐形态就是 `gpui-kit = "0.9.1"`），引擎同时跟到 gpui-fast 0.1.14。
# 版本演进：0.7.3（2026-10-19，引擎换 gpui-fast 0.1.9）→ 0.8.0（0.1.10）→
# 0.9.0（0.1.13）→ **0.9.1（0.1.14，默认后端 gpui-pre 0.3.12）**。
#
# ## 为什么这次换成门面（以前是刻意不用的）
# 以前直连 gpui-fast / gpui-component / gpui-base / gpui-kit-assets 五条线，根因是
# 「一旦启用 gpui-fast，全图必须同源」：那三个 crate 的 `gpui-fast` feature 干的事只是
# `extern crate gpui_fast as gpui;`，而它们自己的 `gpui` 依赖仍指向 gpui-pre，于是
# app 侧必须把 `gpui` 也指到 gpui-fast，并且**五条线必须同版本一起动** —— 只升其中之一，
# 组件库与引擎的 `gpui` 就不是同一个 crate，`impl Render for MainView` 会报
# 「trait bound not satisfied」，看着像业务代码写错。
# 门面把这件事收进了它自己的 Cargo.toml：`gpui-fast` 一次转发到 core / platform /
# base / component / assets 全层，`gpui-fast-platform` 的 `x11` / `wayland` /
# `font-kit` / `runtime_shaders` 也由它代为打开（见 gpui-kit 0.9.1 的 Cargo.toml）。
# 「版本漂移 / feature 漏开」这一类坑从此不存在，根 Cargo.toml 也就只剩一条依赖。
#
# ## 代码里为什么还写 `gpui::`（而不是 `gpui_kit::`）
# 每个用到 GPUI 的 crate 根各有一行 `extern crate gpui_kit as gpui;`
# （ui/src/lib.rs、shell/src/lib.rs、terminal/src/lib.rs）。这不是图省事，而是**必需**：
# gpui 的 derive 宏（`Render` / `IntoElement` / `VisualContext` …）展开出来的路径是
# 字面量 `gpui::...`，源码里那些 `#[derive(..)]` 只有在这个别名下才解析得到 ——
# gpui-kit 官方文档也是这么推荐的（“applications can alias the Kit as `gpui`”）。
# 同一个别名让 `#[gpui::test]` 解析到门面的 `test` 宏。
# **不要再单独依赖 gpui-pre / gpui-fast**：同名类型分属两个 crate 的症状见上文。
#
# ## 0.9.1 一起带过来的东西
# · `syntect`：给 `TextView::markdown` 的**围栏代码块**上色（AI 消息正文走这条路，
#   见 ui/src/ai_panel.rs）。不开的话代码块是无色纯文本。门面用同名 feature 转发到
#   gpui-component；高亮配色取组件的 `highlight_theme`，不跟随本仓 token 覆盖。
# · 0.1.14 的行为变化：「没被 notify 的视图复用上一帧、不再重建」。本仓的呼吸圆点是
#   动画调度器显式 `cx.notify`（TabStatusDot 是独立视图），不依赖每帧重建，语义不变。
# · `test-support`：**只在 dev-dependencies 打开**（ui / shell），供 `#[gpui::test]` 用。
#
# ⚠️ 门面对 gpui-fast 打开了 `windows-manifest-provided-by-host`：**gpui-fast 不再
# 自己嵌清单**。但门面同时仍把 `gpui-pre`（默认后端）当**非可选**依赖拉进图里，它的
# build.rs 照旧嵌一份（PerMonitorV2 + comctl32 v6 + SegmentHeap）—— 所以本仓**不缺**
# 清单，**也绝不能自己再嵌一份**：两端都是 MANIFEST/1/0x0409，LINK 阶段直接
# `CVTRES: fatal error CVT1100: 资源重复` + `LNK1123`（2026-11-16 实测踩中，
# 见 app/assets/rustshell.rc 顶部的说明）。清单原文备在
# `app/assets/rustshell.manifest.xml`，仅供 gpui-pre 将来不再随门面分发时补位。
# 自检（缺清单的症状是 150% 缩放下整窗被 DWM 位图拉伸、糊成一片，且不报错）：
#   python -c "print(open('target/debug/rustshell.exe','rb').read().count(b'PerMonitorV2'))"
# 应当 ≥ 1。
gpui-kit = { version = "0.9.1", features = ["gpui-fast", "syntect"] }
# 终端引擎（本仓自有 crate）
rustshell-terminal = { path = "terminal" }

# --- 终端 / PTY ---
portable-pty = "0.9"
alacritty_terminal = "0.26"
# vte 的 `Handler::set_mouse_cursor_icon` 签名里用的是它**私有再导出**的
# `cursor_icon::CursorIcon`（不是 `vte::ansi::CursorIcon`，那个路径是私有项、会报 E0603）。
# 我们的 `Handler` 转发层要写全 71 个方法签名 ⇒ 必须显式依赖它。
# 版本与 vte 0.15 所用的保持一致（见 Cargo.lock 的 cursor-icon 1.2.0）。
cursor-icon = "1.2"
# 终端文本缓冲（行/块索引），rustshell-terminal 的搜索与滚回使用
ropey = "1"
# 字符显示宽度（East Asian Width）：终端网格里宽字符占 2 列、组合记号占 0 列，
# 批量文本绘制必须按它决定每段的 `force_width`（terminal/src/render.rs）
unicode-width = "0.2"

# --- SSH ---
russh = "0.63"
# SFTP 子系统客户端（SFTP v3 协议；不强依赖 russh 版本，channel 流接入）
russh-sftp = "2"
# 下载校验（F-13）：0.11 本来就在 Windows 依赖图里（russh → ssh-key 的
# bcrypt-pbkdf / ed25519-dalek / p256 都用它），提为直接依赖**不新增编译**；
# 0.10.x 反而不在图内（只有 Linux 的 keyring 线在拉），别降版本。
sha2 = "0.11"

# --- 系统 / 异步 ---
sysinfo = "0.39"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }

# --- 通用 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# AI Provider：轻量 HTTP 客户端（rustls，无原生依赖）
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
thiserror = "2"
parking_lot = "0.12"
flume = "0.12"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
log = { version = "0.4", features = ["std"] }
# 终端字符编码转码（Firefox 同源实现，纯 Rust 无 C 依赖）
encoding_rs = "0.8"
# SMTP 投递（F-20 预警邮件）：STARTTLS 与隐式 TLS（465）都要握手。
# 复用依赖树里已有的 rustls（russh / ureq 都引了它），不引入第二套 TLS 栈 ——
# 两套栈并存会让「证书链校验行为」出现两个不一致的口径。
# `ring` 而非默认的 aws-lc：后者在 Windows 需要 NASM（见 core/Cargo.toml 的说明）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"

# --- 内部 crate ---
rustshell-core = { path = "core" }
rustshell-platform = { path = "platform" }
rustshell-ui = { path = "ui" }
rustshell-shell = { path = "shell" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 2
